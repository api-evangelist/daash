aid: daash
name: Daash
description: DAASH is an AI-powered predictive commerce intelligence platform built specifically for the
  beauty and cosmetics industry. It combines consumer shopping panels covering 6M+ people with social and
  advertising trend data and enriched product attributes to estimate sales performance, market share, and
  emerging trends at the SKU level. DAASH delivers weekly competitive intelligence to beauty brands,
  manufacturers, and financial services firms so they can uncover category shifts, benchmark competitor
  performance, and spot growth opportunities. The company was founded at the intersection of predictive
  intelligence and consumer products by retail and data experts (Philip Smolin, CEO; Justin Stewart, CTO;
  Melissa Munnerlyn, CMO), and is a portfolio company of Bullpen Capital. DAASH is delivered as a hosted
  SaaS application (my.daash.co); it currently exposes no public developer API surface.
